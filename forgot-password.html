<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Wave & Zen account password." />
  <title>Forgot Password | Wave & Zen</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="auth-body">
  <main class="auth-viewport auth-forgot" id="forgot-password-page">
    <a class="auth-brand" href="index.html" aria-label="Wave and Zen home">
      <img src="assets/images/logo.png" alt="" />
      <span>Wave &amp; Zen</span>
    </a>

    <section class="auth-visual" aria-label="Calm ocean at sunrise">
      <img src="assets/images/auth/register.png" alt="Calm coastal waves at sunrise" />
      <div class="auth-visual-overlay">
        <span class="auth-eyebrow">Account Recovery</span>
        <blockquote>“Pause, reset, and return to the water when you are ready.”</blockquote>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-heading">
          <span class="section-tag">Account recovery</span>
          <h1>Reset your password</h1>
          <p>Enter your account email and we will send password reset instructions.</p>
        </div>
        <form class="auth-form" id="forgot-password-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgot-email">Email Address</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Send Reset Link</button>
        </form>
        <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
