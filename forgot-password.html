<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reset your Wave & Zen account password." />
  <title>Forgot Password | Wave & Zen</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/jpn88iab/image/upload/v1784784208/favicon_jseahq.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="auth-body">
  <main class="auth-viewport auth-forgot" id="forgot-password-page">
    <a class="auth-brand" href="index.html" aria-label="Wave and Zen home">
      <img src="https://res.cloudinary.com/jpn88iab/image/upload/v1784784212/logo_juzzdy.png" alt="" />
      <span>Wave &amp; Zen</span>
    </a>
    <div class="auth-controls" aria-label="Display preferences">
      <button class="action-btn theme-toggle-btn auth-theme-toggle" id="auth-forgot-theme-toggle" type="button" aria-label="Switch to dark theme" title="Dark theme">
        <svg viewBox="0 0 24 24" class="theme-toggle-icon" aria-hidden="true">
          <path d="M15.8 3.35a7.2 7.2 0 1 0 4.35 10.95 6.35 6.35 0 0 1-4.35-10.95Z"></path>
          <path d="m18.8 3.1.35.85.85.35-.85.35-.35.85-.35-.85-.85-.35.85-.35.35-.85Z"></path>
          <path d="M3 17.15c2.1-1.65 4.2-1.65 6.3 0s4.2 1.65 6.3 0 4.2-1.65 5.4-.7"></path>
          <path d="M4.5 20.35c1.7-1 3.4-1 5.1 0s3.4 1 5.1 0 3.4-1 4.8-.35"></path>
        </svg>
      </button>
      <button class="action-btn dir-toggle-btn auth-dir-toggle" id="auth-forgot-dir-toggle" type="button" aria-label="Toggle RTL">
        <span class="dir-toggle-label">RTL</span>
      </button>
    </div>

    <section class="auth-visual" aria-label="Calm ocean at sunrise">
      <img src="https://res.cloudinary.com/jpn88iab/image/upload/v1784784180/login_rga3mb.jpg" alt="Calm coastal waves at sunrise" />
      <div class="auth-visual-overlay">
        <span class="auth-eyebrow">Account Recovery</span>
        <blockquote>“Pause, reset, and return to the water when you are ready.”</blockquote>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-heading">
          <span class="section-tag">Account recovery</span>
          <h1>Reset your password</h1>
          <p>Enter your account email and we will send password reset instructions.</p>
        </div>
        <form class="auth-form" id="forgot-password-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="forgot-email">Email Address</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <button type="submit" class="btn btn-primary auth-submit">Send Reset Link</button>
        </form>
        <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
