<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your Wave & Zen account to manage bookings and access member content." />
  <title>Login | Wave & Zen</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/jpn88iab/image/upload/v1784784208/favicon_jseahq.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/sections.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="auth-body">
  <main class="auth-viewport" id="login-page">
    <a class="auth-brand" href="index.html" aria-label="Wave and Zen home">
      <img src="https://res.cloudinary.com/jpn88iab/image/upload/v1784784212/logo_juzzdy.png" alt="" />
      <span>Wave &amp; Zen</span>
    </a>
    <div class="auth-controls" aria-label="Display preferences">
      <button class="action-btn theme-toggle-btn auth-theme-toggle" id="auth-login-theme-toggle" type="button" aria-label="Switch to dark theme" title="Dark theme">
        <svg viewBox="0 0 24 24" class="theme-toggle-icon" aria-hidden="true">
          <path d="M15.8 3.35a7.2 7.2 0 1 0 4.35 10.95 6.35 6.35 0 0 1-4.35-10.95Z"></path>
          <path d="m18.8 3.1.35.85.85.35-.85.35-.35.85-.35-.85-.85-.35.85-.35.35-.85Z"></path>
          <path d="M3 17.15c2.1-1.65 4.2-1.65 6.3 0s4.2 1.65 6.3 0 4.2-1.65 5.4-.7"></path>
          <path d="M4.5 20.35c1.7-1 3.4-1 5.1 0s3.4 1 5.1 0 3.4-1 4.8-.35"></path>
        </svg>
      </button>
      <button class="action-btn dir-toggle-btn auth-dir-toggle" id="auth-login-dir-toggle" type="button" aria-label="Toggle RTL">
        <span class="dir-toggle-label">RTL</span>
      </button>
    </div>

    <section class="auth-visual" aria-label="Wave and Zen member experience">
      <img src="https://res.cloudinary.com/jpn88iab/image/upload/v1784784180/login_rga3mb.jpg" alt="Surfer enjoying a Wave and Zen coastal session" />
      <div class="auth-visual-overlay">
        <span class="auth-eyebrow">Member Portal</span>
        <blockquote>“Every morning could be the day you catch the perfect wave.”</blockquote>
        <cite>Marcus Chen, Head Coach</cite>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <div class="auth-heading">
          <span class="section-tag">Welcome back</span>
          <h1>Sign in to Wave &amp; Zen</h1>
          <p>Access your bookings, session history, and member content.</p>
        </div>

        <div class="auth-social-group">
          <button class="btn btn-outline auth-social-btn" id="login-google-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button class="btn btn-outline auth-social-btn" id="login-facebook-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </button>
          <button class="btn btn-outline auth-social-btn" id="login-apple-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.1.09 2.22-.58 2.95-1.39z"/></svg>
            Apple
          </button>
        </div>

        <div class="auth-divider"><span>or sign in with email</span></div>

        <form class="auth-form" id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password" />
          </div>
          <div class="auth-options">
            <label class="checkbox-label" for="login-remember">
              <input type="checkbox" id="login-remember" />
              <span>Remember me</span>
            </label>
            <a class="forgot-password" id="login-forgot-link" href="forgot-password.html">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary auth-submit" id="login-submit-btn">Sign In</button>
        </form>

        <p class="auth-switch">New to Wave &amp; Zen? <a href="register.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
